# Publishes the password-protected site to GitHub Pages.
# Saves the images (as WebP) and the showreel the site uses into the sealed media backup (media/), then
# runs on every update to main, and from Actions → "Publish site" → Run workflow (use it after changing SITE_PASSWORD).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the WebP converter
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Build the locked site
        env:
          SITE_PACK_KEY: ${{ secrets.SITE_PACK_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node tools/site-lock.mjs build site.pack _site
      - name: Save new media to the sealed backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A media
          if git diff --cached --quiet; then echo "No new media"; else git commit -m "Update sealed media backup" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
